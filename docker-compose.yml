version: '3.8'

services:
  mysql-db:
    image: mysql:8.0
    container_name: shopsmart-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: shopsmart_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  product-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: product-service
    container_name: product-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      - mysql-db

  order-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: order-service
    container_name: order-service
    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - INVENTORY_SERVICE_URL=http://inventory-service:8083/api/inventory
    depends_on:
      - mysql-db

  inventory-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: inventory-service
    container_name: inventory-service
    ports:
      - "8083:8083"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      - mysql-db

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      - SERVICE_PRODUCT_URL=http://product-service:8081
      - SERVICE_ORDER_URL=http://order-service:8082
      - SERVICE_INVENTORY_URL=http://inventory-service:8083
    depends_on:
      - product-service
      - order-service
      - inventory-service

  frontend:
    image: nginx:alpine
    container_name: shopsmart-frontend
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
    depends_on:
      - api-gateway

volumes:
  mysql_data:
